---
# selene standard-library shim for TestEZ. The specs in tests/ run inside a TestEZ runner that
# injects these as globals, so without this selene reports every `describe`/`it`/`expect` as an
# undefined variable and `selene src tests` (the command in the README) can never pass.
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  itFOCUS:
    args:
      - type: string
      - type: function
  itSKIP:
    args:
      - type: string
      - type: function
  describeFOCUS:
    args:
      - type: string
      - type: function
  describeSKIP:
    args:
      - type: string
      - type: function
  beforeAll:
    args:
      - type: function
  beforeEach:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  expect:
    args:
      - type: any
    must_use: false
  FIXME:
    args:
      - type: any
        required: false
  FOCUS:
    args: []
  SKIP:
    args: []
